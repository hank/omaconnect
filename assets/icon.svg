<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <linearGradient id="phone-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bg-grad)" stroke="url(#accent-grad)" stroke-width="4" />

  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#accent-grad)" stroke-width="2" opacity="0.3" />
  
  <!-- Signal Orbit Arc -->
  <path d="M 136,256 A 120,120 0 0,1 376,256" fill="none" stroke="url(#accent-grad)" stroke-width="6" stroke-dasharray="12 8" stroke-linecap="round" />
  
  <!-- Smartphone Frame -->
  <rect x="186" y="116" width="140" height="280" rx="24" fill="url(#phone-grad)" stroke="url(#accent-grad)" stroke-width="6" filter="url(#glow)" />
  
  <!-- Screen Area -->
  <rect x="198" y="146" width="116" height="220" rx="12" fill="#090D16" opacity="0.9" />

  <!-- Speaker Slot -->
  <rect x="236" y="128" width="40" height="6" rx="3" fill="#38BDF8" opacity="0.8" />

  <!-- Home Indicator / Notch -->
  <rect x="231" y="376" width="50" height="4" rx="2" fill="#818CF8" opacity="0.8" />

  <!-- Connection / Battery Symbol inside Screen -->
  <!-- Top Bar Battery -->
  <rect x="274" y="158" width="26" height="12" rx="3" fill="none" stroke="#38BDF8" stroke-width="2" />
  <rect x="276" y="160" width="18" height="8" rx="1" fill="#38BDF8" />
  <path d="M 301,162 L 301,166" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />

  <!-- Sync Arrows Icon in Center -->
  <g transform="translate(256, 256)">
    <!-- Rotating Pulse Circle -->
    <circle cx="0" cy="0" r="32" fill="#1E293B" stroke="url(#accent-grad)" stroke-width="3" />
    
    <!-- Sync Arrow 1 -->
    <path d="M -14,-6 A 16,16 0 0,1 12,-10 L 8,-16 M 12,-10 L 14,-2" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Sync Arrow 2 -->
    <path d="M 14,6 A 16,16 0 0,1 -12,10 L -8,16 M -12,10 L -14,2" fill="none" stroke="#C084FC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Connection Nodes / Signals outside -->
  <circle cx="136" cy="256" r="10" fill="#38BDF8" />
  <circle cx="376" cy="256" r="10" fill="#C084FC" />
  <circle cx="256" cy="96" r="8" fill="#818CF8" />

</svg>
